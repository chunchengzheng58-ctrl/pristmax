name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-cors pyyaml

    - name: Test Storage Agent CLI
      run: |
        python -m src.pristmax.agent.cli --help

    - name: Test MCP Server
      run: |
        echo '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | python -m src.pristmax.agent.mcp_server --mode stdio

  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install flask flask-cors pyyaml pyinstaller

    - name: Build executable
      run: |
        if exist main.spec (
          pyinstaller main.spec --noconfirm
        ) else (
          echo "main.spec not found, skipping build"
        )

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pristmax-exe
        path: dist/*.exe
      if: success()
