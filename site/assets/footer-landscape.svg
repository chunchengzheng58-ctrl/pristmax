<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky gradient: deep indigo to pale blue -->
    <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b3e"/>
      <stop offset="40%" stop-color="#1a3a6b"/>
      <stop offset="75%" stop-color="#2a5a8a"/>
      <stop offset="100%" stop-color="#4a8ab0"/>
    </linearGradient>
    <!-- Mist gradient -->
    <linearGradient id="mist-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8e0f0" stop-opacity="0"/>
      <stop offset="30%" stop-color="#e8f4fc" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#e8f4fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c8e0f0" stop-opacity="0"/>
    </linearGradient>
    <!-- Gold gradient for distant mountains -->
    <linearGradient id="gold-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <!-- Blue mountains -->
    <linearGradient id="blue-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4a8a"/>
      <stop offset="100%" stop-color="#2a6a9a"/>
    </linearGradient>
    <!-- Turquoise mountains -->
    <linearGradient id="turq-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a7a9a"/>
      <stop offset="100%" stop-color="#3a9aaa"/>
    </linearGradient>
    <!-- Near gold hills -->
    <linearGradient id="gold-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a030"/>
      <stop offset="100%" stop-color="#8a7020"/>
    </linearGradient>
    <!-- River -->
    <linearGradient id="river-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a4a6a"/>
      <stop offset="100%" stop-color="#0a2a3a"/>
    </linearGradient>
    <!-- Glow filter for pavilions -->
    <filter id="pavilion-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Mist blur -->
    <filter id="mist-blur"><feGaussianBlur stdDeviation="8"/></filter>
    <!-- Mountain clip: animated from bottom -->
    <clipPath id="mountains-clip"><rect class="clip-rect" x="0" y="520" width="1440" height="520"/></clipPath>
  </defs>

  <!-- ==================== SKY ==================== -->
  <rect class="layer-sky" x="0" y="0" width="1440" height="520" fill="url(#sky-grad)"/>

  <!-- ==================== DISTANT MOUNTAINS (pale gold, far) ==================== -->
  <g class="layer-far-mountains" opacity="0">
    <!-- Left distant ridge -->
    <path d="M0,380 L60,300 L120,340 L200,260 L280,310 L350,240 L420,280 L480,220 L540,260 L600,200 L660,240 L720,180 L780,220 L840,170 L900,210 L960,160 L1020,200 L1080,180 L1140,220 L1200,170 L1260,200 L1320,160 L1380,190 L1440,140 L1440,520 L0,520 Z" fill="#8a7a9a" opacity="0.5"/>
    <!-- Right distant ridge (mirrored feel) -->
    <path d="M0,360 L80,280 L160,320 L240,250 L320,290 L400,230 L480,270 L540,210 L600,240 L660,190 L720,230 L780,170 L840,200 L900,160 L960,190 L1020,150 L1080,180 L1140,140 L1200,170 L1260,130 L1320,160 L1380,120 L1440,150 L1440,520 L0,520 Z" fill="#9a8aaa" opacity="0.4"/>
  </g>

  <!-- ==================== FAR MIST BAND 1 ==================== -->
  <g class="layer-mist-far" opacity="0" filter="url(#mist-blur)">
    <rect x="0" y="280" width="1440" height="80" fill="url(#mist-grad)" opacity="0.6"/>
  </g>

  <!-- ==================== MID MOUNTAINS (prussian blue) ==================== -->
  <g class="layer-mid-mountains-blue" opacity="0">
    <!-- Main prussian blue ridge chain left-center -->
    <path d="M0,400 L30,360 L90,380 L150,300 L220,340 L290,260 L360,300 L420,230 L490,270 L560,200 L630,240 L700,180 L770,220 L830,160 L900,200 L960,150 L1020,180 L1080,130 L1140,160 L1200,120 L1260,150 L1320,110 L1380,130 L1440,100 L1440,520 L0,520 Z" fill="url(#blue-mid)"/>
    <!-- Extra blue peak cluster -->
    <path d="M200,340 L260,280 L320,310 L380,250 L440,290 L500,220 L560,260 L620,200 L680,240 L740,180 L800,220 L860,160 L920,200 L980,150 L1040,180 L1100,130 L1160,160 L1220,110 L1280,140 L1340,100 L1400,120 L1440,90 L1440,520 L0,520 Z" fill="#1a3a7a" opacity="0.7"/>
  </g>

  <!-- ==================== TURQUOISE MID MOUNTAINS ==================== -->
  <g class="layer-mid-mountains-turq" opacity="0">
    <path d="M0,430 L40,390 L100,410 L170,350 L240,380 L310,310 L380,350 L450,280 L520,320 L590,250 L660,290 L730,220 L800,260 L870,200 L940,240 L1010,180 L1080,210 L1150,160 L1220,190 L1290,140 L1360,170 L1440,120 L1440,520 L0,520 Z" fill="url(#turq-mid)"/>
    <!-- Turquoise accent peaks -->
    <path d="M300,380 L380,310 L450,350 L520,280 L590,320 L660,250 L730,290 L800,220 L870,260 L940,200 L1010,230 L1080,170 L1150,210 L1220,160 L1290,190 L1360,140 L1440,160 L1440,520 L0,520 Z" fill="#2a6a8a" opacity="0.8"/>
  </g>

  <!-- ==================== MIST BAND 2 ==================== -->
  <g class="layer-mist-mid" opacity="0" filter="url(#mist-blur)">
    <rect x="0" y="330" width="1440" height="90" fill="url(#mist-grad)" opacity="0.5"/>
  </g>

  <!-- ==================== NEAR MOUNTAINS (gold/amber) ==================== -->
  <g class="layer-near-mountains" opacity="0">
    <path d="M0,480 L60,420 L130,450 L210,380 L290,410 L370,350 L450,390 L530,320 L610,360 L690,300 L770,340 L850,280 L930,320 L1010,260 L1090,300 L1170,250 L1250,290 L1330,240 L1400,270 L1440,230 L1440,520 L0,520 Z" fill="url(#gold-near)"/>
    <!-- Golden foreground hills -->
    <path d="M0,500 L80,460 L170,480 L260,430 L350,460 L440,410 L530,440 L620,390 L710,420 L800,380 L890,410 L980,370 L1070,400 L1160,360 L1250,390 L1340,350 L1430,380 L1440,370 L1440,520 L0,520 Z" fill="#a08020"/>
    <!-- Extra gold accent -->
    <path d="M100,480 L180,440 L270,460 L360,420 L450,450 L540,400 L630,440 L720,390 L810,430 L900,380 L990,420 L1080,370 L1170,410 L1260,360 L1350,400 L1440,350 L1440,520 L0,520 Z" fill="#b89030" opacity="0.7"/>
  </g>

  <!-- ==================== RIVER (lower third) ==================== -->
  <g class="layer-river" opacity="0">
    <path d="M0,450 Q180,430 360,440 Q540,450 720,435 Q900,420 1080,440 Q1260,455 1440,440 L1440,520 L0,520 Z" fill="url(#river-grad)"/>
    <!-- River reflective highlights -->
    <path d="M0,455 Q180,438 360,445 Q540,452 720,440 Q900,428 1080,445 Q1260,458 1440,448" fill="none" stroke="#4a8aaa" stroke-width="1.5" opacity="0.4"/>
    <path d="M0,465 Q180,450 360,458 Q540,465 720,455 Q900,445 1080,458 Q1260,468 1440,460" fill="none" stroke="#3a7a9a" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- ==================== PAVILIONS / PAGODAS ==================== -->
  <!-- Large pagoda right-center area -->
  <g class="layer-pavilions" opacity="0" filter="url(#pavilion-glow)">
    <!-- Main pagoda complex - center-right -->
    <g transform="translate(820, 300)">
      <!-- Base platform -->
      <rect x="-25" y="60" width="50" height="8" fill="#8a3010" rx="1"/>
      <!-- Level 1 body -->
      <rect x="-20" y="30" width="40" height="30" fill="#c84020" rx="2"/>
      <!-- Level 1 roof -->
      <path d="M-28,30 L0,15 L28,30 Z" fill="#d4a020"/>
      <path d="M-30,30 L0,13 L30,30 Z" fill="none" stroke="#d4a020" stroke-width="1"/>
      <!-- Level 2 body -->
      <rect x="-15" y="8" width="30" height="22" fill="#c84020" rx="1"/>
      <!-- Level 2 roof -->
      <path d="M-22,8 L0,-5 L22,8 Z" fill="#d4a020"/>
      <!-- Level 3 body -->
      <rect x="-10" y="-8" width="20" height="16" fill="#c84020" rx="1"/>
      <!-- Level 3 roof -->
      <path d="M-16,-8 L0,-18 L16,-8 Z" fill="#d4a020"/>
      <!-- Spire -->
      <line x1="0" y1="-18" x2="0" y2="-30" stroke="#d4a020" stroke-width="2"/>
      <circle cx="0" cy="-30" r="3" fill="#d4a020"/>
    </g>

    <!-- Small pavilion left-center -->
    <g transform="translate(320, 340)">
      <rect x="-12" y="20" width="24" height="20" fill="#c84020" rx="1"/>
      <path d="M-18,20 L0,8 L18,20 Z" fill="#d4a020"/>
      <line x1="0" y1="8" x2="0" y2="0" stroke="#d4a020" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="2" fill="#d4a020"/>
    </g>

    <!-- Tiny pavilion far left -->
    <g transform="translate(80, 360)">
      <rect x="-8" y="12" width="16" height="12" fill="#b83010" rx="1"/>
      <path d="M-12,12 L0,4 L12,12 Z" fill="#c89010"/>
    </g>

    <!-- Medium pavilion right side -->
    <g transform="translate(1180, 330)">
      <rect x="-14" y="22" width="28" height="18" fill="#c84020" rx="1"/>
      <path d="M-20,22 L0,10 L20,22 Z" fill="#d4a020"/>
      <line x1="0" y1="10" x2="0" y2="2" stroke="#d4a020" stroke-width="1.5"/>
      <circle cx="0" cy="2" r="2.5" fill="#d4a020"/>
    </g>

    <!-- Small pavilion far right -->
    <g transform="translate(1380, 350)">
      <rect x="-10" y="16" width="20" height="14" fill="#b83010" rx="1"/>
      <path d="M-15,16 L0,6 L15,16 Z" fill="#c89010"/>
    </g>

    <!-- Mid-ground small structure center -->
    <g transform="translate(580, 355)">
      <rect x="-9" y="14" width="18" height="12" fill="#c04020" rx="1"/>
      <path d="M-13,14 L0,5 L13,14 Z" fill="#d4a020"/>
    </g>
  </g>

  <!-- ==================== PINE TREES (slender gold) ==================== -->
  <g class="layer-pines" opacity="0">
    <!-- Pine cluster left -->
    <g transform="translate(180, 390)">
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#8a6010" stroke-width="2"/>
      <ellipse cx="-6" cy="-30" rx="8" ry="4" fill="#6a8020" transform="rotate(-20 -6 -30)"/>
      <ellipse cx="6" cy="-38" rx="8" ry="4" fill="#6a8020" transform="rotate(20 6 -38)"/>
      <ellipse cx="0" cy="-45" rx="6" ry="3" fill="#7a9030"/>
    </g>
    <!-- Pine center-left -->
    <g transform="translate(480, 375)">
      <line x1="0" y1="0" x2="0" y2="-35" stroke="#8a6010" stroke-width="1.5"/>
      <ellipse cx="-5" cy="-25" rx="7" ry="3" fill="#5a7020" transform="rotate(-25 -5 -25)"/>
      <ellipse cx="5" cy="-32" rx="7" ry="3" fill="#5a7020" transform="rotate(25 5 -32)"/>
    </g>
    <!-- Pine far right -->
    <g transform="translate(1300, 370)">
      <line x1="0" y1="0" x2="0" y2="-30" stroke="#8a6010" stroke-width="1.5"/>
      <ellipse cx="-4" cy="-20" rx="6" ry="3" fill="#6a8020" transform="rotate(-20 -4 -20)"/>
      <ellipse cx="4" cy="-27" rx="6" ry="3" fill="#6a8020" transform="rotate(20 4 -27)"/>
    </g>
    <!-- Pine right-center -->
    <g transform="translate(1050, 380)">
      <line x1="0" y1="0" x2="0" y2="-28" stroke="#8a6010" stroke-width="1.5"/>
      <ellipse cx="-4" cy="-18" rx="6" ry="3" fill="#5a7020" transform="rotate(-20 -4 -18)"/>
      <ellipse cx="4" cy="-25" rx="6" ry="3" fill="#5a7020" transform="rotate(20 4 -25)"/>
    </g>
  </g>

  <!-- ==================== NEAR MIST (foreground) ==================== -->
  <g class="layer-mist-near" opacity="0" filter="url(#mist-blur)">
    <rect x="0" y="420" width="1440" height="100" fill="url(#mist-grad)" opacity="0.4"/>
  </g>

  <!-- ==================== FOREGROUND ROCKS / DETAIL ==================== -->
  <g class="layer-foreground" opacity="0">
    <!-- Left foreground rock -->
    <ellipse cx="60" cy="510" rx="50" ry="12" fill="#5a4010" opacity="0.6"/>
    <ellipse cx="30" cy="515" rx="30" ry="8" fill="#4a3010" opacity="0.5"/>
    <!-- Right foreground rock -->
    <ellipse cx="1380" cy="508" rx="55" ry="14" fill="#5a4010" opacity="0.6"/>
    <ellipse cx="1410" cy="514" rx="28" ry="8" fill="#4a3010" opacity="0.5"/>
    <!-- Center foreground detail -->
    <ellipse cx="720" cy="516" rx="40" ry="10" fill="#6a5020" opacity="0.4"/>
  </g>

  <!-- ==================== PAPER TEXTURE OVERLAY ==================== -->
  <rect class="layer-texture" x="0" y="0" width="1440" height="520" fill="url(#sky-grad)" opacity="0.03"/>
</svg>
