server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.133.180.156;
    root /var/www/pristmax;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
server {
    listen 80;
    server_name jiangchenghehe.top www.jiangchenghehe.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name jiangchenghehe.top www.jiangchenghehe.top;
    ssl_certificate /etc/nginx/ssl/ashou.pem;
    ssl_certificate_key /etc/nginx/ssl/ashou.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/pristmax;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }

    # SSE 流支持
    location /api/tasks/ {
        proxy_pass http://127.0.0.1:5001/api/tasks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }

    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
