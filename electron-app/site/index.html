<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pristmax — Storage Optimization</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #113577;
            --primary-dark: #0c2854;
            --accent: #d4af37;
            --bg: #f5f7fa;
            --bg-dark: #e8ecf0;
            --sidebar-bg: #1a1a2e;
            --sidebar-text: #a0a8b8;
            --sidebar-hover: rgba(255,255,255,0.08);
            --sidebar-active: #113577;
            --text: #1a1a2e;
            --text-muted: #6b7280;
            --border: #d1d5db;
            --success: #27ca40;
            --warning: #f59e0b;
            --danger: #ef4444;
            --white: #ffffff;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        /* Title Bar */
        .title-bar {
            height: 32px;
            background: var(--sidebar-bg);
            display: flex;
            align-items: center;
            padding: 0 8px;
            -webkit-app-region: drag;
            user-select: none;
            flex-shrink: 0;
        }

        .title-bar-logo {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--white);
            font-size: 12px;
            font-weight: 600;
            margin-right: auto;
        }

        .title-bar-logo svg {
            width: 14px;
            height: 14px;
        }

        .title-bar-controls {
            display: flex;
            -webkit-app-region: no-drag;
        }

        .title-bar-btn {
            width: 36px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--sidebar-text);
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .title-bar-btn:hover {
            background: rgba(255,255,255,0.1);
            color: var(--white);
        }

        .title-bar-btn.close:hover {
            background: var(--danger);
            color: white;
        }

        /* App Container */
        .app-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 60px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-icon {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--sidebar-text);
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }

        .sidebar-icon:hover {
            background: var(--sidebar-hover);
            color: var(--white);
        }

        .sidebar-icon.active {
            color: var(--white);
        }

        .sidebar-icon.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--accent);
        }

        .sidebar-icon svg {
            width: 22px;
            height: 22px;
        }

        .sidebar-divider {
            height: 1px;
            background: rgba(255,255,255,0.1);
            margin: 8px 12px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            height: 50px;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            flex-shrink: 0;
        }

        .top-bar-title {
            font-size: 15px;
            font-weight: 600;
        }

        .top-bar-path {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0 12px;
            height: 34px;
            cursor: pointer;
        }

        .top-bar-path:hover {
            border-color: var(--primary);
        }

        .top-bar-path svg {
            width: 16px;
            height: 16px;
            color: var(--text-muted);
        }

        .top-bar-path span {
            flex: 1;
            font-size: 13px;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .top-bar-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            background: var(--white);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s;
        }

        .top-bar-btn:hover {
            background: var(--bg);
            border-color: var(--primary);
        }

        .top-bar-btn.primary {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--white);
        }

        .top-bar-btn.primary:hover {
            background: var(--primary-dark);
        }

        .top-bar-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Metrics */
        .metrics-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .metric-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
        }

        .metric-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
        }

        .metric-value .unit {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Panel */
        .panel {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
        }

        .panel-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        /* File List */
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .file-item:hover {
            background: var(--bg);
        }

        .file-item.selected {
            background: rgba(17, 53, 119, 0.08);
        }

        .file-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 13px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .file-size {
            font-size: 12px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        /* Actions Grid */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .action-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .action-card:hover {
            border-color: var(--primary);
            background: rgba(17, 53, 119, 0.04);
        }

        .action-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .action-text h4 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .action-text p {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Progress */
        .progress-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .progress-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
        }

        .progress-bar {
            height: 6px;
            background: var(--bg);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
            transition: width 0.3s;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 12px;
        }

        /* Status Bar */
        .status-bar {
            height: 24px;
            background: var(--primary);
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 11px;
            color: rgba(255,255,255,0.8);
            gap: 16px;
            flex-shrink: 0;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        /* Tab Bar */
        .tab-bar {
            display: flex;
            gap: 4px;
            padding: 0 20px;
            background: var(--white);
            border-bottom: 1px solid var(--border);
        }

        .tab-item {
            padding: 12px 16px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
        }

        .tab-item:hover {
            color: var(--text);
        }

        .tab-item.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Two Column Layout */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
        }

        /* Storage Chart */
        .storage-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }

        .storage-label {
            width: 80px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .storage-track {
            flex: 1;
            height: 20px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .storage-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
        }

        .storage-value {
            width: 60px;
            font-size: 12px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <!-- Title Bar -->
    <div class="title-bar">
        <div class="title-bar-logo">
            <svg viewBox="0 0 24 24" fill="#d4af37">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <span>Pristmax</span>
        </div>
        <div class="title-bar-controls">
            <button class="title-bar-btn" id="btn-minimize" title="最小化">
                <svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
            </button>
            <button class="title-bar-btn" id="btn-maximize" title="最大化">
                <svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
            </button>
            <button class="title-bar-btn close" id="btn-close" title="关闭">
                <svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5"/></svg>
            </button>
        </div>
    </div>

    <!-- App Container -->
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-icon active" data-page="overview" title="概览">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                </svg>
            </div>
            <div class="sidebar-icon" data-page="files" title="文件">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/>
                    <polyline points="13,2 13,9 20,9"/>
                </svg>
            </div>
            <div class="sidebar-icon" data-page="duplicates" title="重复文件">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="8" y="8" width="12" height="12" rx="2"/>
                    <path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/>
                </svg>
            </div>
            <div class="sidebar-icon" data-page="large" title="大文件">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="17,8 12,3 7,8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </div>

            <div class="sidebar-divider"></div>

            <div class="sidebar-icon" data-page="tasks" title="任务">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9,11 12,14 22,4"/>
                    <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                </svg>
            </div>
            <div class="sidebar-icon" data-page="reports" title="报告">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                    <polyline points="14,2 14,8 20,8"/>
                </svg>
            </div>

            <div style="flex: 1;"></div>

            <div class="sidebar-icon" data-page="settings" title="设置">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
                </svg>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="top-bar-title" id="page-title">概览</div>
                <div class="top-bar-path" id="path-selector">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
                    </svg>
                    <span id="current-path">选择文件夹...</span>
                </div>
                <button class="top-bar-btn primary" id="btn-scan">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                    扫描
                </button>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Metrics Row -->
                <div class="metrics-row">
                    <div class="metric-card">
                        <div class="metric-label">文件总数</div>
                        <div class="metric-value" id="metric-files">0</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">总大小</div>
                        <div class="metric-value" id="metric-size">0 <span class="unit">GB</span></div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">重复文件</div>
                        <div class="metric-value" id="metric-duplicates">0</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">可释放空间</div>
                        <div class="metric-value" id="metric-savings">0 <span class="unit">GB</span></div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">快速操作</span>
                    </div>
                    <div class="panel-body">
                        <div class="actions-grid">
                            <div class="action-card" id="action-scan-dir">
                                <div class="action-icon">📁</div>
                                <div class="action-text">
                                    <h4>扫描目录</h4>
                                    <p>分析文件夹结构</p>
                                </div>
                            </div>
                            <div class="action-card" id="action-find-dup">
                                <div class="action-icon">📦</div>
                                <div class="action-text">
                                    <h4>查找重复</h4>
                                    <p>检测重复文件</p>
                                </div>
                            </div>
                            <div class="action-card" id="action-find-large">
                                <div class="action-icon">📊</div>
                                <div class="action-text">
                                    <h4>查找大文件</h4>
                                    <p>找出占用空间最多的文件</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Two Columns -->
                <div class="two-col">
                    <!-- File List -->
                    <div class="panel">
                        <div class="panel-header">
                            <span class="panel-title">文件列表</span>
                            <span class="panel-title" style="color: var(--text-muted); font-weight: 400;" id="file-count">0 个文件</span>
                        </div>
                        <div class="panel-body">
                            <div class="file-list" id="file-list">
                                <div class="empty-state">
                                    <div class="empty-state-icon">📂</div>
                                    <h3>暂无数据</h3>
                                    <p>选择文件夹开始扫描</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Storage Info -->
                    <div class="panel">
                        <div class="panel-header">
                            <span class="panel-title">存储分类</span>
                        </div>
                        <div class="panel-body">
                            <div class="storage-bar">
                                <div class="storage-label">视频</div>
                                <div class="storage-track"><div class="storage-fill" style="width: 0%"></div></div>
                                <div class="storage-value" id="size-video">0 GB</div>
                            </div>
                            <div class="storage-bar">
                                <div class="storage-label">图片</div>
                                <div class="storage-track"><div class="storage-fill" style="width: 0%"></div></div>
                                <div class="storage-value" id="size-image">0 GB</div>
                            </div>
                            <div class="storage-bar">
                                <div class="storage-label">文档</div>
                                <div class="storage-track"><div class="storage-fill" style="width: 0%"></div></div>
                                <div class="storage-value" id="size-doc">0 GB</div>
                            </div>
                            <div class="storage-bar">
                                <div class="storage-label">代码</div>
                                <div class="storage-track"><div class="storage-fill" style="width: 0%"></div></div>
                                <div class="storage-value" id="size-code">0 GB</div>
                            </div>
                            <div class="storage-bar">
                                <div class="storage-label">其他</div>
                                <div class="storage-track"><div class="storage-fill" style="width: 0%"></div></div>
                                <div class="storage-value" id="size-other">0 GB</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-item">
            <span class="status-dot"></span>
            <span id="status-text">就绪</span>
        </div>
        <div style="flex: 1;"></div>
        <div>Pristmax v1.2.0</div>
    </div>

    <script src="main.js"></script>
</body>
</html>
